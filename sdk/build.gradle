plugins {
    id 'com.android.library'
}

android {
    namespace 'com.example.updatekit'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    // AGP 8.x：发布前需声明要发布的 variant，否则 components.release 不存在
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    // org.json 由 Android 系统提供（android.jar），无需额外依赖
    testImplementation 'junit:junit:4.13.2'
}

// JitPack：把 :sdk 作为独立 AAR 发布，坐标 com.github.wanwu2026.<Repo>:sdk:<tag>
apply plugin: 'maven-publish'
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.wanwu2026'
                artifactId = "$d"
                version = '1.0'
            }
        }
    }
}
